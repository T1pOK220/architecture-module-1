<rect x="150" y="10" width="640" height="540" rx="14" fill="#FAFBFD" stroke="#3B6FD4" stroke-width="2"/>
<text x="164" y="32" font-size="13" font-weight="bold" fill="#3B6FD4">OrderFlow: один process, один deployment, один rollback</text>
