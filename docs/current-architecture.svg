<rect x="370" y="330" width="160" height="56" rx="8" fill="#E8F0FE" stroke="#3B6FD4" stroke-width="1.6"/>
<text x="450.0" y="355.0" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#222">Notifications</text>
<text x="450.0" y="370.0" text-anchor="middle" font-size="10.5" fill="#555">sync email (await)</text>
