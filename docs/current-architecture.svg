<text x="325" y="322" text-anchor="end" font-size="10.5" fill="#D9822B" font-weight="bold" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">sync, await</text>
<text x="325" y="335" text-anchor="end" font-size="10.5" fill="#D9822B" font-weight="bold" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">критичний шлях</text>
<polyline points="530,268 830,268" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a-dark)"/>
<text x="545" y="252" text-anchor="start" font-size="11" fill="#333333" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">sync, без timeout</text>
<text x="545" y="288" text-anchor="start" font-size="11" fill="#333333" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">p95 ≈ 2,2 с, ~5% помилок</text>
<polyline points="530,358 830,358" fill="none" stroke="#333333" stroke-width="1.6" marker-end="url(#a-dark)"/>
<text x="545" y="352" text-anchor="start" font-size="11" fill="#333333" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">sync</text>
<polyline points="450,150 450,116" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-red)"/>
<text x="460" y="137" text-anchor="start" font-size="10.5" fill="#C0392B" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">читає products для total</text>
<polyline points="450,240 450,206" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-red)"/>
<text x="460" y="227" text-anchor="start" font-size="10.5" fill="#C0392B" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">OrderRepository (чужий)</text>
<polyline points="530,468 630,468" fill="none" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a-red)"/>
<text x="545" y="457" text-anchor="start" font-size="10.5" fill="#C0392B" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">читає 4 таблиці</text>
<text x="165" y="519" text-anchor="start" font-size="11" fill="#333333" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Суцільні стрілки: свідомі виклики.</text>
<text x="165" y="535" text-anchor="start" font-size="11" fill="#C0392B" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Червоний пунктир: порушення ownership.</text>
