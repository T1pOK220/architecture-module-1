<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">OrderFlow: запропонована архітектура</title><desc id="d">Core лишається одним deployable: Checkout синхронно викликає Pricing, Orders, Inventory і PaymentsApi (з timeout), а Notifications і Reporting отримують події через durable outbox. Reporting service виділяється лише у Фазі 3 за trigger.</desc>
