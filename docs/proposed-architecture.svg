<text x="200" y="656" text-anchor="start" font-size="11.5" fill="#333333" stroke="#fff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Зелений: події та дані; фіолетовий: Payments boundary; пунктир: умовно (Фаза 3).</text>
